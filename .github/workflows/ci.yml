name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Postgres image (pre-warm for testcontainers)
        run: docker pull postgres:16-alpine
      - name: Install dependencies
        # Fuente única: backend/pyproject.toml (dependencies + grupo test).
        run: |
          python - > "$RUNNER_TEMP/requirements.txt" <<'EOF'
          import tomllib
          with open("backend/pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          print("\n".join(d["project"]["dependencies"] + d["dependency-groups"]["test"]))
          EOF
          pip install -r "$RUNNER_TEMP/requirements.txt" ruff
      - name: Lint
        run: ruff check backend
      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx vite build
