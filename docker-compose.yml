services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: turnos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://turnos:changeme@db:5432/turnos
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Gateway QR de WhatsApp (C-15, DD-10). Solo arranca con: docker compose --profile whatsapp up -d waha
  # Riesgo de bloqueo/ToS asumido; operación en docs/whatsapp-sesion.md.
  waha:
    profiles: ["whatsapp"]
    image: devlikeapro/waha:latest-2026.10.1
    restart: unless-stopped
    environment:
      # Misma clave que WHATSAPP_GATEWAY_API_KEY del backend (solo env, nunca en el repo).
      # Vacía = gateway sin autenticación: solo aceptable en desarrollo (puerto atado a 127.0.0.1).
      WAHA_API_KEY: ${WHATSAPP_GATEWAY_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  pgdata:
  waha_sessions:
